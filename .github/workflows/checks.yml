name: Source checks

"on":
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Android build, unit tests and lint
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    defaults:
      run:
        working-directory: launcher
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Ensure Android SDK 34 and build tools 34
        run: >-
          "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          --install "platforms;android-34" "build-tools;34.0.0"
      - name: Build and check the debug source preview
        # Use the committed Gradle 8.9 wrapper; do not use the runner's system Gradle.
        run: ./gradlew --no-daemon --console=plain :app:assembleDebug :app:testDebugUnitTest :app:lintDebug

  remote:
    name: Offline companion tests and browser syntax
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Python 3.12
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Run offline standard-library tests
        # Tests inject fake device transports. No ADB, TV, account or private config is needed.
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python -B -m unittest discover -s remote/tests -v
      - name: Check browser JavaScript syntax
        # Ubuntu 24.04 hosted runners include Node; no browser or remote server is started.
        run: node --check remote/dist/app.js
      - name: Check remote interactions
        run: node --test remote/tests/test_frontend.js
