name: Source checks

"on":
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    name: Redacted Git history secret scan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out complete history
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify and run pinned Gitleaks
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          scan_directory="$(mktemp -d "${RUNNER_TEMP}/nepal-gitleaks.XXXXXX")"
          trap 'rm -rf "$scan_directory"' EXIT
          archive="$scan_directory/gitleaks.tar.gz"
          curl --fail --silent --show-error --location \
            --proto '=https' --proto-redir '=https' --tlsv1.2 --max-time 60 \
            --output "$archive" \
            'https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz'
          printf '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  %s\n' "$archive" | sha256sum --check --strict
          tar -xzf "$archive" -C "$scan_directory" gitleaks
          chmod 700 "$scan_directory/gitleaks"
          "$scan_directory/gitleaks" git --redact=100 --no-banner --no-color \
            --timeout 120 --exit-code 1 --log-opts='--all' .

  android:
    name: Android build, unit tests and lint (${{ matrix.project }})
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        project: [launcher, framextv]
    defaults:
      run:
        working-directory: ${{ matrix.project }}
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up JDK 17
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "17"
      - name: Ensure Android SDK 34 and build tools 34
        run: >-
          "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          --install "platforms;android-34" "build-tools;34.0.0"
      - name: Verify official Gradle wrapper
        # This official 9.8.2 wrapper launches the separately pinned 8.9 distribution.
        run: printf '3b8a25775a69158b5ad2b1d17a80a88dc7b40a352a73eb27d06c612a7ce68e98  gradle/wrapper/gradle-wrapper.jar\n' | sha256sum --check --strict
      - name: Build and check the debug source preview
        # Use the committed Gradle 8.9 wrapper; do not use the runner's system Gradle.
        run: ./gradlew --no-daemon --console=plain :app:assembleDebug :app:testDebugUnitTest :app:lintDebug

  remote:
    name: Offline companion tests and browser syntax
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Python 3.12
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Install pinned companion dependencies
        # Only verified wheels from the fixed public index are accepted.
        run: >-
          python -m pip install --isolated --require-hashes --only-binary=:all:
          -r remote/requirements.txt --index-url https://pypi.org/simple
      - name: Run offline companion tests
        # Tests inject fake device transports. No ADB, TV, account or private config is needed.
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python -B -m unittest discover -s remote/tests -v
      - name: Check browser JavaScript syntax
        # Ubuntu 24.04 hosted runners include Node; no browser or remote server is started.
        run: node --check remote/dist/app.js
      - name: Check remote interactions
        run: node --test remote/tests/test_frontend.js
